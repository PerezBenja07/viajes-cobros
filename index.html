<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajes y Cobros</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0f766e, #134e4a);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin-bottom: 0;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 24px;
      letter-spacing: 1px;
    }

    .logout-btn {
      border: none;
      background: #334155;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .logout-btn:hover { background: #475569; }

    .counters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .counter {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .counter .amount {
      display: block;
      font-size: 26px;
      font-weight: bold;
    }

    .counter .label {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.75;
    }

    .counter.collected .amount { color: #15803d; }
    .counter.pending .amount { color: #dc2626; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    .precio-wrapper {
      position: relative;
    }

    .precio-wrapper .precio-prefix {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      font-weight: bold;
      color: #475569;
    }

    .precio-wrapper input {
      padding-left: 24px;
    }

    .status-buttons {
      display: flex;
      gap: 8px;
    }

    .status-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      background: #f8fafc;
      cursor: pointer;
    }

    .status-btn.cobrado.selected {
      background: #dcfce7;
      border-color: #15803d;
      color: #15803d;
    }

    .status-btn.pendiente.selected {
      background: #fee2e2;
      border-color: #dc2626;
      color: #dc2626;
    }

    .add-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      background: #0f766e;
      color: #fff;
      cursor: pointer;
    }

    .add-btn:hover { background: #0d5e58; }

    .form-msg {
      min-height: 20px;
      font-size: 14px;
      color: #dc2626;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
    }

    h2 {
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .trip-list {
      list-style: none;
    }

    .trip-item {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .trip-info {
      flex: 1;
      margin-right: 10px;
    }

    .trip-route {
      font-size: 16px;
      font-weight: bold;
    }

    .trip-price {
      font-size: 14px;
      color: #475569;
    }

    .trip-badge {
      font-size: 13px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .trip-badge.cobrado { background: #dcfce7; color: #15803d; }
    .trip-badge.pendiente { background: #fee2e2; color: #dc2626; }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      font-size: 14px;
      font-weight: bold;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 8px;
      flex: none;
    }

    .delete-btn:hover { background: #fecaca; }

    .pay-btn {
      border: none;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      flex: none;
      margin-left: 6px;
    }

    .pay-btn:hover { background: #bae6fd; }

    .edit-btn {
      border: none;
      background: #f1f5f9;
      color: #475569;
      font-size: 14px;
      font-weight: bold;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 6px;
      flex: none;
    }

    .edit-btn:hover { background: #e2e8f0; }

    .cancel-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      margin-top: 8px;
    }

    .cancel-btn:hover { background: #e2e8f0; }

    .form-msg.ok { color: #15803d; }

    .filtros {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filtro-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }

    .filtro-btn.selected {
      background: #0f766e;
      border-color: #0f766e;
      color: #fff;
    }

    .filtro-mes {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .filtro-mes input[type="month"] {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    .filtro-limpiar {
      border: none;
      background: #e2e8f0;
      color: #334155;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .filtro-limpiar:hover { background: #cbd5e1; }

    .pay-control {
      display: flex;
      gap: 4px;
      margin-left: 6px;
      flex: none;
      align-items: center;
    }

    .pay-input {
      width: 76px;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
    }

    .pay-ok {
      border: none;
      background: #15803d;
      color: #fff;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .abono-line {
      font-size: 13px;
      color: #0369a1;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #e2e8f0;
      padding: 20px;
    }

    .login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
    }

    .login-screen[hidden] { display: none; }

    .auth-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 360px;
    }

    .auth-card h1 {
      color: #0f766e;
      margin-bottom: 16px;
    }

    .auth-title {
      font-size: 18px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 14px;
      text-align: center;
    }

    .auth-card input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      margin-bottom: 12px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 42px;
    }

    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover { color: #0f766e; }

    .auth-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .auth-btn.primary {
      background: #0f766e;
      color: #fff;
    }

    .auth-btn.primary:hover { background: #0d5e58; }
    .auth-btn.primary:disabled { opacity: 0.6; cursor: wait; }

    .auth-btn.secondary {
      background: #f1f5f9;
      color: #334155;
    }

    .auth-btn.secondary:hover { background: #e2e8f0; }

    .auth-message {
      min-height: 20px;
      font-size: 14px;
      color: #dc2626;
      margin-bottom: 10px;
      text-align: center;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .menu-option {
      background: #fff;
      border: none;
      border-radius: 12px;
      padding: 22px 18px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .menu-option:hover {
      background: #f0fdfa;
      transform: translateY(-2px);
    }

    .menu-option .menu-icon {
      display: block;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .menu-option .menu-title {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: #0f766e;
      letter-spacing: 1px;
    }

    .menu-option .menu-sub {
      display: block;
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .menu-balance {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .menu-balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .menu-balance-label {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #64748b;
    }

    .balance-toggle {
      border: none;
      background: #f1f5f9;
      color: #334155;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .balance-toggle:hover { background: #e2e8f0; }

    .menu-balance-amount {
      display: block;
      font-size: 34px;
      font-weight: bold;
      color: #0f766e;
    }

    .menu-balance-amount.negativo { color: #dc2626; }

    .trip-empresa {
      font-size: 13px;
      color: #0f766e;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .trip-date {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .trip-gastos {
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
    }

    .trip-gastos.positivo { color: #15803d; }
    .trip-gastos.negativo { color: #dc2626; }

    .card h2 {
      color: #334155;
      margin-bottom: 6px;
    }

    .gasto-resumen {
      background: #fff7ed;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }

    .gasto-resumen .amount {
      display: block;
      font-size: 28px;
      font-weight: bold;
      color: #b45309;
    }

    .gasto-resumen .label {
      font-size: 13px;
      letter-spacing: 1px;
      color: #b45309;
      opacity: 0.75;
    }

    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    .cat-row:last-child { border-bottom: none; }

    .cat-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #334155;
    }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .cat-amount {
      font-weight: bold;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen" hidden>
    <div class="auth-card">
      <h1>Viajes y Cobros</h1>
      <div class="auth-title" id="authTitle">Iniciar sesión</div>
      <input type="email" id="authEmail" name="email" placeholder="Correo electrónico" autocomplete="email">
      <div class="password-wrapper">
        <input type="password" id="authPassword" name="password" placeholder="Contraseña" autocomplete="current-password">
        <button type="button" class="password-toggle" id="authTogglePassword" aria-label="Mostrar contraseña">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="auth-message" id="authMessage"></div>
      <button type="button" class="auth-btn primary" id="authSubmit">Iniciar sesión</button>
      <button type="button" class="auth-btn secondary" id="authToggle">¿No tienes cuenta? Crear cuenta</button>
    </div>
  </div>

  <div class="app" id="menuScreen" hidden>
    <div class="header">
      <h1>Viajes y Cobros</h1>
      <button class="logout-btn" id="menuLogoutBtn">Salir</button>
    </div>

    <div class="menu-balance">
      <div class="menu-balance-header">
        <span class="menu-balance-label">TOTAL GANADO</span>
        <button type="button" class="balance-toggle" id="balanceToggle" title="Ocultar total">Ocultar</button>
      </div>
      <span class="menu-balance-amount" id="balanceAmount">$0</span>
    </div>

    <div class="menu">
      <button type="button" class="menu-option" id="menuViajesBtn">
        <span class="menu-icon">🚚</span>
        <span class="menu-title">VIAJES</span>
        <span class="menu-sub">Administra tus viajes y cobros</span>
      </button>
      <button type="button" class="menu-option" id="menuGastosBtn">
        <span class="menu-icon">💸</span>
        <span class="menu-title">MIS GASTOS</span>
        <span class="menu-sub">Lleva el control de tus gastos</span>
      </button>
    </div>
  </div>

  <div class="app" id="gastosScreen" hidden>
    <div class="header">
      <h1>Mis Gastos</h1>
      <button class="logout-btn" id="gastosBackBtn">Menú</button>
    </div>

    <div class="gasto-resumen">
      <span class="amount" id="gastosMes">$0</span>
      <span class="label">GASTADO ESTE MES</span>
    </div>

    <div class="card">
      <h2>Por categoría</h2>
      <div id="gastosCategorias"></div>
    </div>

    <form class="card" id="gastoForm">
      <div class="form-group">
        <label for="gastoDescripcion">Descripción</label>
        <input type="text" id="gastoDescripcion" placeholder="Ej. Combustible 200L" required>
      </div>
      <div class="form-group">
        <label for="gastoMonto">Monto</label>
        <div class="precio-wrapper">
          <span class="precio-prefix">$</span>
          <input type="text" id="gastoMonto" inputmode="decimal" placeholder="0" required>
        </div>
      </div>
      <div class="form-group">
        <label for="gastoCategoria">Categoría</label>
        <select id="gastoCategoria">
          <option value="combustible">Combustible</option>
          <option value="peajes">Peajes</option>
          <option value="comida">Comida</option>
          <option value="alojamiento">Alojamiento</option>
          <option value="mantenimiento">Mantenimiento</option>
          <option value="multas">Multas</option>
          <option value="otros">Otros</option>
        </select>
      </div>
      <div class="form-group">
        <label for="gastoFecha">Fecha</label>
        <input type="date" id="gastoFecha">
      </div>
      <div class="form-group">
        <label for="gastoViaje">Viaje asociado (opcional)</label>
        <select id="gastoViaje">
          <option value="">Sin asociar</option>
        </select>
      </div>
      <button type="submit" class="add-btn" id="gastoSubmitBtn">Agregar Gasto</button>
      <button type="button" class="cancel-btn" id="gastoCancelBtn" hidden>Cancelar</button>
    </form>
    <div class="form-msg" id="gastoMsg"></div>

    <h2>Gastos</h2>
    <ul class="trip-list" id="gastosList"></ul>
  </div>

  <div class="app" id="app" hidden>
    <div class="header">
      <h1>Viajes y Cobros</h1>
      <div class="header-actions">
        <button class="logout-btn" id="backToMenuBtn">Menú</button>
        <button class="logout-btn" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div class="counters">
      <div class="counter collected">
        <span class="amount" id="totalCobrado">$0</span>
        <span class="label">TOTAL COBRADO</span>
      </div>
      <div class="counter pending">
        <span class="amount" id="totalPendiente">$0</span>
        <span class="label">POR COBRAR</span>
      </div>
    </div>

    <form class="card" id="viajeForm">
      <div class="form-group">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" placeholder="Ej. Transportes San Juan">
      </div>
      <div class="form-group">
        <label for="ruta">Ruta</label>
        <input type="text" id="ruta" placeholder="Ej. Centro - Mercado" required>
      </div>
      <div class="form-group">
        <label for="fechaViaje">Fecha del viaje</label>
        <input type="date" id="fechaViaje">
      </div>
      <div class="form-group">
        <label for="precio">Precio</label>
        <div class="precio-wrapper">
          <span class="precio-prefix">$</span>
          <input type="text" id="precio" inputmode="decimal" placeholder="0" required>
        </div>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <div class="status-buttons" id="statusButtons">
          <button type="button" class="status-btn cobrado" data-estado="cobrado">Cobrado</button>
          <button type="button" class="status-btn pendiente selected" data-estado="pendiente">Pendiente</button>
        </div>
      </div>
      <div class="form-group" id="abonoGroup">
        <label for="abono">Abono (ya pagado)</label>
        <div class="precio-wrapper">
          <span class="precio-prefix">$</span>
          <input type="text" id="abono" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <button type="submit" class="add-btn" id="viajeSubmitBtn">Agregar Viaje</button>
      <button type="button" class="cancel-btn" id="viajeCancelBtn" hidden>Cancelar</button>
    </form>
    <div class="form-msg" id="viajeMsg"></div>

    <h2>Viajes</h2>
    <div class="filtros">
      <button type="button" class="filtro-btn selected" data-filtro-estado="todos">Todos</button>
      <button type="button" class="filtro-btn" data-filtro-estado="cobrado">Cobrados</button>
      <button type="button" class="filtro-btn" data-filtro-estado="pendiente">Pendientes</button>
    </div>
    <div class="filtro-mes">
      <input type="month" id="filtroMes">
      <button type="button" class="filtro-limpiar" id="filtroMesLimpiar">Todos los meses</button>
    </div>
    <ul class="trip-list" id="tripList"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function cargarSupabaseAlternativo() {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/@supabase/supabase-js@2';
      s.onload = iniciarApp;
      s.onerror = function () {
        var m = document.getElementById('authMessage');
        if (m) m.textContent = 'No se pudo cargar Supabase. Revisa tu conexión a internet.';
      };
      document.head.appendChild(s);
    }

    function money(n) {
      const partes = Number(n).toFixed(2).split('.');
      const entero = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return '$' + entero + ',' + partes[1];
    }

    function formatPrecioInput(v) {
      v = v.replace(/\./g, '').replace(/[^0-9,]/g, '');
      const idx = v.lastIndexOf(',');
      let decimal = '';
      let entero = v;
      if (idx > -1) {
        decimal = v.slice(idx + 1);
        entero = v.slice(0, idx);
      }
      if (entero.length > 0) {
        entero = parseInt(entero, 10).toString();
      }
      entero = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      let out = entero.length > 0 ? entero : '0';
      if (idx > -1) {
        out = out + ',' + decimal.slice(0, 2);
      }
      return out;
    }

    function parsePrecio(v) {
      return parseFloat(v.replace(/\./g, '').replace(',', '.'));
    }

    function precioAInput(n) {
      const s = Number(n).toFixed(2).split('.');
      return formatPrecioInput(s[0]) + ',' + s[1];
    }

    function hoyISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatFecha(f) {
      if (!f) return '';
      const p = String(f).split('-');
      if (p.length !== 3) return f;
      return p[2] + '/' + p[1] + '/' + p[0];
    }

      if (m.indexOf('at least') !== -1) return 'La contraseña debe tener al menos 6 caracteres';
      if (m.indexOf('Invalid email') !== -1) return 'El correo no es válido';
      return m;

    async function cargarViajes() {
      if (viajes.length === 0) {
        tripList.innerHTML = '<li class="empty">Cargando...</li>';
      }
      const { data, error } = await supabase
        .from('viajes')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        console.error(error);
        if (viajes.length === 0) {
          tripList.innerHTML = '<li class="empty">No se pudieron cargar los viajes</li>';
        }
        return;
      }
      viajes = data;
      await cargarGastos();
    }

    async function cargarGastos() {
      const { data, error } = await supabase
        .from('gastos')
        .select('*')
        .order('fecha', { ascending: false })
        .order('created_at', { ascending: false });
      gastosError = !!error;
      gastos = error ? [] : data;
      if (error) console.error(error);
      render();
      renderGastos();
    }

    function render() {
      let cobrado = 0;
      let pendiente = 0;
      viajes.forEach(function (v) {
        if (!v) return;
        const abono = Math.min(v.abono || 0, v.precio);
        if (v.estado === 'cobrado') {
          cobrado += v.precio;
        } else {
          cobrado += abono;
          pendiente += v.precio - abono;
        }
      });
      totalCobrado.textContent = money(cobrado);
      totalPendiente.textContent = money(pendiente);
      actualizarMenuBalance();

      const gastosPorViaje = {};
      gastos.forEach(function (g) {
        if (!g) return;
        if (!g.viaje_id) return;
        gastosPorViaje[g.viaje_id] = (gastosPorViaje[g.viaje_id] || 0) + (Number(g.monto) || 0);
      });

      tripList.innerHTML = '';
      if (viajes.length === 0) {
        tripList.innerHTML = '<li class="empty">Aún no hay viajes registrados</li>';
        return;
      }
      const lista = viajes.filter(function (v) {
        if (filtroEstado !== 'todos' && v.estado !== filtroEstado) return false;
        if (filtroMes && String(v.fecha || '').slice(0, 7) !== filtroMes) return false;
        return true;
      });
      if (lista.length === 0) {
        tripList.innerHTML = '<li class="empty">No hay viajes para este filtro</li>';
        return;
      }
      lista.forEach(function (v) {
        if (!v) return;
        const li = document.createElement('li');
        li.className = 'trip-item';
        const abono = Math.min(v.abono || 0, v.precio);

        const info = document.createElement('div');
        info.className = 'trip-info';

        if (v.empresa) {
          const empresa = document.createElement('div');
          empresa.className = 'trip-empresa';
          empresa.textContent = v.empresa;
          info.appendChild(empresa);
        }

        const route = document.createElement('div');
        route.className = 'trip-route';
        route.textContent = v.ruta;
        const price = document.createElement('div');
        price.className = 'trip-price';
        price.textContent = money(v.precio);
        info.appendChild(route);
        info.appendChild(price);

        if (v.fecha) {
          const fecha = document.createElement('div');
          fecha.className = 'trip-date';
          fecha.textContent = formatFecha(v.fecha);
          info.appendChild(fecha);
        }

        if (v.estado === 'pendiente' && abono > 0) {
          const abonoLine = document.createElement('div');
          abonoLine.className = 'abono-line';
          abonoLine.textContent = 'Pagado ' + money(abono) + ' · Falta ' + money(v.precio - abono);
          info.appendChild(abonoLine);
        }

        const gastosViaje = gastosPorViaje[v.id] || 0;
        if (gastosViaje > 0) {
          const cobradoViaje = v.estado === 'cobrado' ? (Number(v.precio) || 0) : (Number(v.abono) || 0);
          const ganancia = cobradoViaje - gastosViaje;
          const gastosLine = document.createElement('div');
          gastosLine.className = 'trip-gastos ' + (ganancia >= 0 ? 'positivo' : 'negativo');
          gastosLine.textContent = 'Gastos: ' + money(gastosViaje) + ' · Ganancia: ' + money(ganancia);
          info.appendChild(gastosLine);
        }

        const badge = document.createElement('span');
        badge.className = 'trip-badge ' + v.estado;
        badge.textContent = v.estado === 'cobrado' ? 'Cobrado' : 'Pendiente';

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          eliminarViaje(v.id);
        });

        const edit = document.createElement('button');
        edit.className = 'edit-btn';
        edit.textContent = '✎';
        edit.title = 'Editar viaje';
        edit.addEventListener('click', function (e) {
          e.stopPropagation();
          editarViaje(v);
        });

        li.appendChild(info);
        li.appendChild(badge);

        if (v.estado === 'pendiente') {
          const pay = document.createElement('div');
          pay.className = 'pay-control';
          const payBtn = document.createElement('button');
          payBtn.className = 'pay-btn';
          payBtn.textContent = 'Abonar';
          payBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            pay.innerHTML = '';
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.className = 'pay-input';
            input.placeholder = 'Monto';
            const ok = document.createElement('button');
            ok.className = 'pay-ok';
            ok.textContent = 'OK';
            ok.addEventListener('click', function (e2) {
              e2.stopPropagation();
              const monto = parsePrecio(input.value);
              if (!isNaN(monto) && monto > 0) {
                actualizarViaje(v.id, { abono: Math.min((v.abono || 0) + monto, v.precio) });
              }
            });
            input.addEventListener('input', function () {
              const f = formatPrecioInput(this.value);
              if (this.value !== f) { this.value = f; }
            });
            input.addEventListener('keydown', function (e3) {
              if (e3.key === 'Enter') ok.click();
            });
            input.addEventListener('click', function (e4) { e4.stopPropagation(); });
            pay.appendChild(input);
            pay.appendChild(ok);
            input.focus();
          });
          pay.appendChild(payBtn);
          li.appendChild(pay);
        }

        li.appendChild(edit);
        li.appendChild(del);
        li.addEventListener('click', function () {
          const nuevo = v.estado === 'cobrado' ? 'pendiente' : 'cobrado';
          actualizarViaje(v.id, { estado: nuevo });
        });
        tripList.appendChild(li);
      });
    }

    async function actualizarViaje(id, cambios) {
      const anterior = viajes.find(function (v) { return v.id === id; });
      viajes = viajes.map(function (v) {
        return v.id === id ? Object.assign({}, v, cambios) : v;
      });
      render();
      const { error } = await supabase.from('viajes').update(cambios).eq('id', id);
      if (error) {
        console.error(error);
        if (anterior) {
          viajes = viajes.map(function (v) {
            return v.id === id ? anterior : v;
          });
          render();
        }
      }
    }

    async function eliminarViaje(id) {
      const anterior = viajes;
      viajes = viajes.filter(function (v) { return v.id !== id; });
      render();
      const { error } = await supabase.from('viajes').delete().eq('id', id);
      if (error) {
        console.error(error);
        viajes = anterior;
        render();
      }
    }

    function renderGastos() {
      const mes = hoyISO().slice(0, 7);
      const porCat = {};
      Object.keys(CATEGORIAS).forEach(function (k) { porCat[k] = 0; });
      let totalMes = 0;

      gastos.forEach(function (g) {
        if (!g) return;
        const m = Number(g.monto) || 0;
        if (String(g.fecha).slice(0, 7) === mes) {
          totalMes += m;
          porCat[g.categoria] = (porCat[g.categoria] || 0) + m;
        }
      });
      gastosMes.textContent = money(totalMes);

      gastosCategorias.innerHTML = '';
      Object.keys(CATEGORIAS).forEach(function (k) {
        const row = document.createElement('div');
        row.className = 'cat-row';
        const name = document.createElement('span');
        name.className = 'cat-name';
        const dot = document.createElement('span');
        dot.className = 'cat-dot';
        dot.style.background = CAT_COLORS[k];
        name.appendChild(dot);
        name.appendChild(document.createTextNode(CATEGORIAS[k]));
        const amount = document.createElement('span');
        amount.className = 'cat-amount';
        amount.textContent = money(porCat[k]);
        row.appendChild(name);
        row.appendChild(amount);
        gastosCategorias.appendChild(row);
      });

      gastoViaje.innerHTML = '';
      const sinAsociar = document.createElement('option');
      sinAsociar.value = '';
      sinAsociar.textContent = 'Sin asociar';
      gastoViaje.appendChild(sinAsociar);
      viajes.forEach(function (v) {
        if (!v) return;
        const op = document.createElement('option');
        op.value = v.id;
        let texto = v.ruta;
        if (v.empresa) texto += ' · ' + v.empresa;
        op.textContent = texto;
        gastoViaje.appendChild(op);
      });

      gastosList.innerHTML = '';
      if (gastosError) {
        gastosList.innerHTML = '<li class="empty">No se pudieron cargar los gastos. ¿Pegaste el SQL de la tabla "gastos" en Supabase?</li>';
        return;
      }
      if (gastos.length === 0) {
        gastosList.innerHTML = '<li class="empty">Aún no hay gastos registrados</li>';
        return;
      }
      gastos.forEach(function (g) {
        if (!g) return;
        const li = document.createElement('li');
        li.className = 'trip-item';

        const info = document.createElement('div');
        info.className = 'trip-info';
        const desc = document.createElement('div');
        desc.className = 'trip-route';
        desc.textContent = g.descripcion;
        const monto = document.createElement('div');
        monto.className = 'trip-price';
        monto.textContent = money(g.monto);
        info.appendChild(desc);
        info.appendChild(monto);

        const viaje = viajes.find(function (v) { return v.id === g.viaje_id; });
        const meta = document.createElement('div');
        meta.className = 'trip-date';
        let texto = formatFecha(g.fecha);
        if (viaje) texto += ' · ' + viaje.ruta;
        meta.textContent = texto;
        info.appendChild(meta);

        const badge = document.createElement('span');
        badge.className = 'trip-badge';
        badge.textContent = CATEGORIAS[g.categoria] || CATEGORIAS.otros;
        badge.style.background = CAT_COLORS[g.categoria] + '26';
        badge.style.color = CAT_COLORS[g.categoria];

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          eliminarGasto(g.id);
        });

        const edit = document.createElement('button');
        edit.className = 'edit-btn';
        edit.textContent = '✎';
        edit.title = 'Editar gasto';
        edit.addEventListener('click', function (e) {
          e.stopPropagation();
          editarGasto(g);
        });

        li.appendChild(info);
        li.appendChild(badge);
        li.appendChild(edit);
        li.appendChild(del);
        gastosList.appendChild(li);
      });
    }

    async function eliminarGasto(id) {
      const anterior = gastos;
      gastos = gastos.filter(function (g) { return g.id !== id; });
      render();
      renderGastos();
      const { error } = await supabase.from('gastos').delete().eq('id', id);
      if (error) {
        console.error(error);
        gastos = anterior;
        render();
        renderGastos();
      }
    }

        statusButtons.forEach(function (b) { b.classList.remove('selected'); });

        estadoSeleccionado = btn.dataset.estado;
        abonoGroup.style.display = estadoSeleccionado === 'pendiente' ? '' : 'none';
      });

    precioInput.addEventListener('input', function () {
      const formatted = formatPrecioInput(this.value);
      if (this.value !== formatted) {
        this.value = formatted;
        this.setSelectionRange(this.value.length, this.value.length);
      }
    });

    abonoInput.addEventListener('input', function () {
      const formatted = formatPrecioInput(this.value);
      if (this.value !== formatted) {
        this.value = formatted;
        this.setSelectionRange(this.value.length, this.value.length);
      }
    });

    gastoMonto.addEventListener('input', function () {
      const formatted = formatPrecioInput(this.value);
      if (this.value !== formatted) {
        this.value = formatted;
        this.setSelectionRange(this.value.length, this.value.length);
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      viajeMsg.textContent = '';
      const ruta = rutaInput.value.trim();
      const precio = parsePrecio(precioInput.value);
      if (!ruta || isNaN(precio) || precio < 0) {
        mostrarMsg(viajeMsg, 'Escribe una ruta y un precio válidos.', false);
        return;
      }
      const abonoParcial = estadoSeleccionado === 'pendiente' ? parsePrecio(abonoInput.value) : 0;
      const abono = (!isNaN(abonoParcial) && abonoParcial > 0) ? Math.min(abonoParcial, precio) : 0;
      const datos = {
        empresa: empresaInput.value.trim() || null,
        ruta: ruta,
        fecha: fechaViajeInput.value || hoyISO(),
        precio: precio,
        estado: estadoSeleccionado,
        abono: abono
      };
      if (viajeEditandoId) {
        const { data: actualizado, error } = await supabase
          .from('viajes')
          .update(datos)
          .eq('id', viajeEditandoId)
          .select()
          .single();
        if (error) {
          console.error(error);
          mostrarMsg(viajeMsg, 'No se pudo guardar el viaje: ' + msjError(error), false);
          return;
        }
        viajes = viajes.map(function (v) { return v.id === actualizado.id ? actualizado : v; });
        render();
        modoAgregarViaje();
        mostrarMsg(viajeMsg, 'Viaje actualizado.', true);
        return;
      }
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const { data: nuevo, error } = await supabase
        .from('viajes')
        .insert(Object.assign({ user_id: user.id }, datos))
        .select()
        .single();
      if (error) {
        console.error(error);
        mostrarMsg(viajeMsg, 'No se pudo guardar el viaje: ' + msjError(error), false);
        return;
      }
      viajes.unshift(nuevo);
      render();
      modoAgregarViaje();
      mostrarMsg(viajeMsg, 'Viaje guardado.', true);
    });

    gastoForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      gastoMsg.textContent = '';
      const descripcion = gastoDescripcion.value.trim();
      const monto = parsePrecio(gastoMonto.value);
      if (!descripcion || isNaN(monto) || monto < 0) {
        mostrarMsg(gastoMsg, 'Escribe una descripción y un monto válidos.', false);
        return;
      }
      const datos = {
        descripcion: descripcion,
        monto: monto,
        categoria: gastoCategoria.value,
        fecha: gastoFecha.value || hoyISO(),
        viaje_id: gastoViaje.value || null
      };
      if (gastoEditandoId) {
        const { data: actualizado, error } = await supabase
          .from('gastos')
          .update(datos)
          .eq('id', gastoEditandoId)
          .select()
          .single();
        if (error) {
          console.error(error);
          mostrarMsg(gastoMsg, 'No se pudo guardar el gasto: ' + msjError(error), false);
          return;
        }
        gastos = gastos.map(function (g) { return g.id === actualizado.id ? actualizado : g; });
        renderGastos();
        render();
        modoAgregarGasto();
        mostrarMsg(gastoMsg, 'Gasto actualizado.', true);
        return;
      }
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      const { data: nuevo, error } = await supabase
        .from('gastos')
        .insert(Object.assign({ user_id: user.id }, datos))
        .select()
        .single();
      if (error) {
        console.error(error);
        mostrarMsg(gastoMsg, 'No se pudo guardar el gasto: ' + msjError(error), false);
        return;
      }
      gastos.unshift(nuevo);
      renderGastos();
      render();
      modoAgregarGasto();
      mostrarMsg(gastoMsg, 'Gasto guardado.', true);
    });

    authToggle.addEventListener('click', function () {
      setAuthMode(authMode === 'login' ? 'register' : 'login');
      authMessage.textContent = '';
    });

    const ojoAbierto = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const ojoCerrado = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    authTogglePassword.addEventListener('click', function () {
      const esPassword = authPassword.type === 'password';
      authPassword.type = esPassword ? 'text' : 'password';
      authTogglePassword.setAttribute('aria-label', esPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
      authTogglePassword.innerHTML = esPassword ? ojoCerrado : ojoAbierto;
    });

    balanceToggle.addEventListener('click', function () {
      balanceOculto = !balanceOculto;
      try {
        localStorage.setItem(BALANCE_OCULTO_KEY, balanceOculto ? '1' : '0');
      } catch (e) { }
      actualizarMenuBalance();
    });

    authSubmit.addEventListener('click', async function () {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authMessage.textContent = '';
      if (!email || !password) {
        authMessage.textContent = 'Escribe tu correo y tu contraseña';
        return;
      }
      authSubmit.disabled = true;
      try {
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            authMessage.textContent = msjError(error);
            return;
          }
          recordarDatos(email);
        } else {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) {
            authMessage.textContent = msjError(error);
            return;
          }
          recordarDatos(email);
          if (!data.session) {
            authMessage.textContent = 'Cuenta creada. Ahora inicia sesión.';
            setAuthMode('login');
            return;
          }
        }
      } catch (e) {
        authMessage.textContent = 'Error: ' + (e.message || e);
      } finally {
        authSubmit.disabled = false;
      }
    });

    menuViajesBtn.addEventListener('click', showViajes);
    menuGastosBtn.addEventListener('click', showGastos);
    backToMenuBtn.addEventListener('click', showMenu);
    gastosBackBtn.addEventListener('click', showMenu);

    viajeCancelBtn.addEventListener('click', function () {
      modoAgregarViaje();
    });

    gastoCancelBtn.addEventListener('click', function () {
      modoAgregarGasto();
    });

    filtroBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        filtroEstado = b.dataset.filtroEstado;
        filtroBtns.forEach(function (x) {
          x.classList.toggle('selected', x === b);
        });
        render();
      });
    });

    filtroMesInput.addEventListener('change', function () {
      filtroMes = this.value;
      render();
    });

    filtroMesLimpiar.addEventListener('click', function () {
      filtroMes = '';
      filtroMesInput.value = '';
      render();
    });

    logoutBtn.addEventListener('click', async function () {
      await supabase.auth.signOut();
    });

    menuLogoutBtn.addEventListener('click', async function () {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange(function (event, session) {
      if (session) {
        showMenu();
      } else {
        showLogin();
      }
    });

    supabase.auth.getSession().then(function ({ data }) {
      if (data.session) {
        showMenu();
      } else {
        showLogin();
      }
    });

    fechaViajeInput.value = hoyISO();
    gastoFecha.value = hoyISO();
    }

    if (typeof window.supabase !== 'undefined') {
      iniciarApp();
    } else {
      cargarSupabaseAlternativo();
    }
  </script>
</body>
</html>
