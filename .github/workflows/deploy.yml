# Workflow simple para publicar contenido estatico en GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta al hacer push a la rama principal
  push:
    branches: [main]

  # Permite ejecutar el workflow manualmente desde la pestana Actions
  workflow_dispatch:

# Permisos del GITHUB_TOKEN para poder publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicacion a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicar solo la carpeta de la web de viajes
          path: './web-viajes'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
